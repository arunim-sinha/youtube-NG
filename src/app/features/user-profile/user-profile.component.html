<div class="profile">
  <header class="profile__intro">
    <p>YOUR SPACE</p>
    <h1>Your account</h1>
    <span>Manage your profile and pick up where you left off.</span>
  </header>
  <nav class="profile__tabs" aria-label="Account sections">
    <button
      type="button"
      class="profile__tab"
      [class.profile__tab--active]="activeTab === 'general'"
      [attr.aria-pressed]="activeTab === 'general'"
      (click)="setTab('general')"
    >
      General Information
    </button>
    <button
      type="button"
      class="profile__tab"
      [class.profile__tab--active]="activeTab === 'history'"
      [attr.aria-pressed]="activeTab === 'history'"
      (click)="setTab('history')"
    >
      History
    </button>
    <button
      type="button"
      class="profile__tab"
      [class.profile__tab--active]="activeTab === 'likes'"
      [attr.aria-pressed]="activeTab === 'likes'"
      (click)="setTab('likes')"
    >
      Likes
    </button>
  </nav>

  <div class="profile__content">
    <app-general-info-tab *ngIf="activeTab === 'general'"></app-general-info-tab>
    <app-history-tab *ngIf="activeTab === 'history'"></app-history-tab>
    <app-likes-tab *ngIf="activeTab === 'likes'"></app-likes-tab>
  </div>
</div>

<div class="history">
  <div class="history__header">
    <h3>Watch History</h3>
    <div *ngIf="entries.length">
      <button type="button" *ngIf="!confirmClear" (click)="clearAll()">Clear history</button>
      <span *ngIf="confirmClear" class="history__confirm">
        Clear all history?
        <button type="button" [disabled]="clearing" (click)="clearAll()">{{ clearing ? 'Clearing…' : 'Confirm' }}</button>
        <button type="button" [disabled]="clearing" (click)="cancelClear()">Cancel</button>
      </span>
    </div>
  </div>

  <p *ngIf="error" class="history__error" role="alert">{{ error }}</p>
  <div *ngIf="loading" role="status">Loading history…</div>
  <button *ngIf="!loading && error === 'Watch history could not be loaded.'" type="button" (click)="load()">Try again</button>
  <p *ngIf="!loading && !error && !entries.length" class="history__empty">No watch history yet. Play a video and it will appear here.</p>

  <ul class="history__list">
    <li class="history-item" *ngFor="let entry of entries">
      <a [routerLink]="['/watch', entry.video._id]" class="history-item__link">
        <img class="history-item__thumb" [src]="entry.video.thumbnailUrl" [alt]="entry.video.title" />
        <div>
          <div class="history-item__title">{{ entry.video.title }}</div>
          <div class="history-item__channel">{{ entry.video.channel.username }}</div>
          <div class="history-item__date">Watched {{ entry.lastWatchedAt | date: 'medium' }}</div>
        </div>
      </a>
      <button type="button" class="history-item__remove" [disabled]="removing.has(entry._id)" (click)="remove(entry)">
        {{ removing.has(entry._id) ? 'Removing…' : 'Remove' }}
      </button>
    </li>
  </ul>
</div>

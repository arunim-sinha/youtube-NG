<section class="general-info">
  <p *ngIf="loading" class="general-info__state" role="status">Loading your profile…</p>
  <div *ngIf="error && !profile" class="general-info__state" role="alert">
    <p>{{ error }}</p><button type="button" (click)="load()">Try again</button>
  </div>
  <ng-container *ngIf="!loading && profile">
    <div class="general-info__header">
      <img class="general-info__avatar" [src]="profile.avatarUrl || '/assets/default-avatar.png'" alt="" />
      <div class="general-info__identity">
        <h2>{{ profile.username }}</h2>
        <p class="general-info__email">{{ profile.email }}</p>
        <p class="general-info__joined">Member since {{ profile.createdAt | date: 'longDate' }}</p>
      </div>
      <div class="general-info__actions" *ngIf="!editing">
        <a [routerLink]="['/channel', profile._id]">View my channel</a>
        <a [routerLink]="['/studio', profile._id]">Manage videos</a>
        <button class="general-info__edit" type="button" (click)="startEdit()">Edit profile</button>
      </div>
    </div>

    <p class="general-info__bio" *ngIf="!editing">{{ profile.bio || 'Add a little about yourself to your profile.' }}</p>
    <p *ngIf="success" class="general-info__success" role="status">{{ success }}</p>
    <p *ngIf="error && profile" class="general-info__error" role="alert">{{ error }}</p>

    <form class="general-info__form" *ngIf="editing" (ngSubmit)="save()">
      <label>
        Username
        <input type="text" name="username" [(ngModel)]="draft.username" required maxlength="40" autocomplete="username" />
      </label>
      <label>
        Avatar image URL
        <input type="url" name="avatarUrl" [(ngModel)]="draft.avatarUrl" placeholder="https://…" />
      </label>
      <label>
        Bio
        <textarea name="bio" rows="4" [(ngModel)]="draft.bio" maxlength="500"></textarea>
      </label>
      <div class="general-info__form-actions">
        <button type="submit" [disabled]="saving">{{ saving ? 'Saving…' : 'Save changes' }}</button>
        <button type="button" (click)="cancelEdit()" [disabled]="saving">Cancel</button>
      </div>
    </form>
  </ng-container>
</section>

<div class="general-info" *ngIf="!loading && profile">
  <div class="general-info__header">
    <img class="general-info__avatar" [src]="profile.avatarUrl || '/assets/default-avatar.png'" alt="" />
    <div>
      <h2>{{ profile.username }}</h2>
      <p class="general-info__email">{{ profile.email }}</p>
      <p class="general-info__joined">Joined {{ profile.createdAt | date: 'longDate' }}</p>
    </div>
    <button type="button" *ngIf="!editing" (click)="startEdit()">Edit profile</button>
  </div>

  <p class="general-info__bio" *ngIf="!editing">{{ profile.bio || 'No bio yet.' }}</p>

  <form class="general-info__form" *ngIf="editing" (ngSubmit)="save()">
    <label>
      Username
      <input type="text" name="username" [(ngModel)]="draft.username" required />
    </label>
    <label>
      Avatar URL
      <input type="text" name="avatarUrl" [(ngModel)]="draft.avatarUrl" />
    </label>
    <label>
      Bio
      <textarea name="bio" rows="3" [(ngModel)]="draft.bio"></textarea>
    </label>
    <div class="general-info__form-actions">
      <button type="submit" [disabled]="saving">{{ saving ? 'Saving…' : 'Save changes' }}</button>
      <button type="button" (click)="cancelEdit()">Cancel</button>
    </div>
  </form>
</div>

<div *ngIf="loading">Loading profile…</div>
